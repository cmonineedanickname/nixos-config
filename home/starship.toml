add_newline = false

format = "$username$hostname$directory$git_branch$git_status$character"

[directory]
style = "blue"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[git_branch]
style = "bold yellow"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold yellow"
format = " [$all_status]($style)"

[username]
show_always = false
format = "[$user@](bold green)"

[hostname]
ssh_only = true
format = "[$hostname ](bold green)"
